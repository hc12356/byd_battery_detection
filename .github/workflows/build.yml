name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Install Android SDK & NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          
          # 下载并配置 Android Command Line Tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          mv cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/Android/Sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # 接受许可
          yes | sdkmanager --licenses || true
          
          # 安装 SDK 组件 (注意：这里改为了 ndk;27.0.12077973 对应 27c)
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Build APK with Buildozer
        run: |
          export BUILDOZER_ALLOW_ROOT=1
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          export ANDROID_HOME=$HOME/Android/Sdk
          
          # 开始打包
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ROOT: 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd-battery-app
          path: bin/*.apk
