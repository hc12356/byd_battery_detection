name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 升级到 v4

      - name: Set up Python
        uses: actions/setup-python@v5  # 升级到 v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Install Android SDK & NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          
          # 下载 Android Command Line Tools
          cd $HOME
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          mv cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/Android/Sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # 接受许可并安装必要组件
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build APK with Buildozer
        run: |
          export BUILDOZER_ALLOW_ROOT=1
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          export ANDROID_HOME=$HOME/Android/Sdk
          
          # 开始打包
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ROOT: 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4  # 升级到 v4 (修复错误的关键)
        with:
          name: byd-battery-app
          path: bin/*.apk
